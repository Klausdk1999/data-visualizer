name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm run test:ci -- --testPathIgnorePatterns="e2e"

      - name: Build
        run: npm run build

      - name: Package build
        run: tar -czf data-visualizer-${{ github.ref_name }}.tar.gz .next public package.json package-lock.json next.config.js

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: data-visualizer-*.tar.gz
          generate_release_notes: true
